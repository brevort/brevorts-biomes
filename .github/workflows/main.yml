name: Unzip File on Push

on:
  push:
    branches:
      - main  # Runs when you push to the main branch

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Extract ZIP file
        run: |
          mkdir -p extracted-folder
          unzip -o data.zip -d extracted-folder

      - name: Show extracted files
        run: ls -la extracted-folder

      - name: Commit extracted files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add extracted-folder/*
          git commit -m "Added extracted files" || echo "No changes to commit"
          git push
